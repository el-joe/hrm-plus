# Local HTTPS vhost for HRM Plus (https://hrm-plus.loc). Installed by deploy/setup-local-https-sudo.sh.
# Certificate is issued by a local dev CA (~/.local/share/hrm-plus-ca), never use in production.
<VirtualHost *:443>
    ServerName hrm-plus.loc

    DocumentRoot /var/www/hrm-plus/backend/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/hrm-plus/hrm-plus.loc.crt
    SSLCertificateKeyFile /etc/ssl/hrm-plus/hrm-plus.loc.key

    <Directory /var/www/hrm-plus/backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    LimitRequestBody 52428800

    ErrorLog ${APACHE_LOG_DIR}/hrm-plus.loc_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/hrm-plus.loc_ssl_access.log combined
</VirtualHost>
