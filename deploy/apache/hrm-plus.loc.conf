# Local vhost for the HRM Plus Laravel app (http://hrm-plus.loc). Installed by deploy/setup-local-sudo.sh.
<VirtualHost *:80>
    ServerName hrm-plus.loc

    DocumentRoot /var/www/hrm-plus/backend/public

    <Directory /var/www/hrm-plus/backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    # employee CV / document uploads
    LimitRequestBody 52428800

    ErrorLog ${APACHE_LOG_DIR}/hrm-plus.loc_error.log
    CustomLog ${APACHE_LOG_DIR}/hrm-plus.loc_access.log combined
</VirtualHost>
