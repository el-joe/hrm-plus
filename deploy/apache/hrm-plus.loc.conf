# Local vhost for the HRM Plus Laravel app. Installed by deploy/setup-local-sudo.sh.
# Plain HTTP redirects to HTTPS (see hrm-plus.loc-ssl.conf): browsers only allow
# location/camera (portal check-in) on secure pages, and the session cookie is Secure.
<VirtualHost *:80>
    ServerName hrm-plus.loc

    Redirect permanent / https://hrm-plus.loc/

    ErrorLog ${APACHE_LOG_DIR}/hrm-plus.loc_error.log
    CustomLog ${APACHE_LOG_DIR}/hrm-plus.loc_access.log combined
</VirtualHost>
